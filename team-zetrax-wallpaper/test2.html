<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Hub - Activation</title>
    <style>
        :root {
            --accent-cyan: #00f2ff;
            --accent-blue: #0066ff;
            --bg: #030305;
            --gemini-gradient: linear-gradient(45deg, #4285f4, #9b72cb, #d96570);
        }

        body {
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* --- INITIAL START BUTTON --- */
        /* --- BACKGROUND & OVERLAY --- */
        #blurOverlay {
            position: fixed; inset: 0;
            backdrop-filter: blur(0px);
            background: rgba(0, 0, 0, 0);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; z-index: 5; pointer-events: none;
            cursor: default;
        }
        #blurOverlay.active { 
            backdrop-filter: blur(20px); 
            background: rgba(0, 0, 0, 0.85);
            opacity: 1; 
            pointer-events: auto; 
            /* Cursor indicates clicking here exits the mode */
            cursor: radial-gradient(circle, transparent 0%, rgba(255,238,0,0.1) 100%), pointer;
        }

        .menubar {
            position: absolute; top: 5vh; left: 50%;
            transform: translateX(-50%); z-index: 100;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .power-btn {
            background: none;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            height: 30px;
            width: 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            transition: all 0.3s ease;
        }

        .power-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--accent-cyan);
        }

        /* --- UI WRAPPER (Hidden by default) --- */
        .wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a0a1a 0%, #030305 70%);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            border-radius: 1000px;
        }

        /* Active State */
        .visible .wrapper {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .visible #power-on-container {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.5);
            pointer-events: none;
        }

        /* --- FLOATING CENTRAL HUB --- */
        .ai-btn-container {
            position: relative;
            z-index: 100;
            animation: floatCenter 6s ease-in-out infinite;
        }

        .ai-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #000;
            border: 1px solid #444;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 10px rgba(66, 133, 244, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 25px var(--accent-cyan);
        }

        @keyframes floatCenter {
            0%, 100% { transform: translateY(0) translateX(0); }
            33% { transform: translateY(-10px) translateX(5px); }
            66% { transform: translateY(5px) translateX(-5px); }
        }

        /* --- SVG STYLES --- */
        #network-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .branch-line {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 1;
        }

        .pulse-stream {
            fill: none;
            stroke: url(#pulseGradient);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 40, 300; 
            animation: neuralFlow 1.5s linear infinite;
        }

        @keyframes neuralFlow {
            from { stroke-dashoffset: 340; }
            to { stroke-dashoffset: 0; }
        }

        /* --- DYNAMIC NODES --- */
        .app-node { cursor: pointer; pointer-events: all; }
        .node-rect {
            fill: rgba(10, 10, 15, 0.8);
            stroke: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            transition: all 0.4s ease;
        }

        .app-node:nth-child(odd) { animation: floatNode 5s ease-in-out infinite; }
        .app-node:nth-child(even) { animation: floatNode 7s ease-in-out infinite reverse; }

        @keyframes floatNode {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .app-node:hover .node-rect {
            stroke: var(--accent-cyan);
            fill: rgba(20, 20, 40, 0.95);
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .node-text-ask { fill: #fff; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
        .node-text-name { fill: #888; font-size: 13px; }

        /* --- MODAL --- */
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.98); 
            padding: 30px; border: 1px solid #333;
            border-radius: 24px; z-index: 1000; color: white;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
        }

        input {
            background: #111; border: 1px solid #333; color: #fff;
            padding: 14px; margin: 12px 0; width: 280px; border-radius: 12px;
            display: block; outline: none; transition: border 0.3s;
        }
        input:focus { border-color: var(--accent-cyan); }
        .submit-btn {
            background: var(--gemini-gradient); border: none; padding: 14px;
            width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer;
            color: white; margin-top: 10px;
        }
        .cancel-link {
            background: none; border: none; color: #666; width: 100%; 
            cursor: pointer; margin-top: 15px; font-size: 0.9rem;
        }
    </style>
</head>
<body>
 <div id="blurOverlay"></div>

    <div class="menubar" id="mainMenuBar">
        <button class="power-btn" onclick="activateUI()"></button>
    </div>

    <div class="wrapper">
        <svg id="network-svg" viewBox="0 0 1000 1000">
            <defs>
                <linearGradient id="pulseGradient">
                    <stop offset="0%" stop-color="transparent" />
                    <stop offset="50%" stop-color="#00f2ff" />
                    <stop offset="100%" stop-color="#4285f4" />
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <g id="lines-group"></g>
            <g id="nodes-group"></g>
        </svg>

        <div class="ai-btn-container">
            <button class="ai-btn" onclick="openModal()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19M5 12H19" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="modal">
        <h3 style="margin-top:0; font-weight: 500;">New Neural Link</h3>
        <input type="text" id="appName" placeholder="App Name (e.g. GitHub)">
        <input type="text" id="appLink" placeholder="URL (google.com)">
        <button class="submit-btn" onclick="addNewApp()">Initialize Link</button>
        <button class="cancel-link" onclick="closeModal()">Dismiss</button>
    </div>

    <script>
        const linesGroup = document.getElementById('lines-group');
        const nodesGroup = document.getElementById('nodes-group');
        const centerX = 500;
        const centerY = 500;
        let appRegistry = JSON.parse(localStorage.getItem('myNeuralApps')) || [];

        // 1. ADD THIS: Activation Function
        function activateUI() {
            document.body.classList.add('visible');
            renderNetwork(); // Render only after activation for better performance
        }

        function openModal() { document.getElementById('modal').style.display = 'block'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function addNewApp() {
            const name = document.getElementById('appName').value;
            let link = document.getElementById('appLink').value;
            if (!name || !link) return;
            if (!link.startsWith('http')) link = 'https://' + link;

            appRegistry.push({ name, link });
            localStorage.setItem('myNeuralApps', JSON.stringify(appRegistry));
            
            renderNetwork();
            closeModal();
            document.getElementById('appName').value = '';
            document.getElementById('appLink').value = '';
        }

        function renderNetwork() {
            linesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';
            const placedNodes = [];
            const minDistanceBetweenNodes = 120;

            appRegistry.forEach((app, index) => {
                let endX, endY, found = false;
                let angle, dist;

                let attempts = 0;
                while (!found && attempts < 200) {
                    angle = Math.random() * Math.PI * 2;
                    dist = 220 + Math.random() * 200; 

                    endX = centerX + Math.cos(angle) * dist;
                    endY = centerY + Math.sin(angle) * dist;

                    const isOverlapping = placedNodes.some(node => {
                        const dx = node.x - endX;
                        const dy = node.y - endY;
                        return Math.sqrt(dx*dx + dy*dy) < minDistanceBetweenNodes;
                    });

                    const isOutOfBounds = endX < 100 || endX > 900 || endY < 100 || endY > 900;

                    if (!isOverlapping && !isOutOfBounds) {
                        found = true;
                    }
                    attempts++;
                }

                placedNodes.push({ x: endX, y: endY });

                const curvePower = 0.5;
                const cpX = centerX + Math.cos(angle - curvePower) * (dist * 0.6);
                const cpY = centerY + Math.sin(angle + curvePower) * (dist * 0.6);
                const d = `M ${centerX} ${centerY} Q ${cpX} ${cpY} ${endX} ${endY}`;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", "branch-line");
                linesGroup.appendChild(path);

                const pulse = document.createElementNS("http://www.w3.org/2000/svg", "path");
                pulse.setAttribute("d", d);
                pulse.setAttribute("class", "pulse-stream");
                pulse.setAttribute("filter", "url(#glow)");
                pulse.style.animationDelay = (Math.random() * 2) + "s";
                linesGroup.appendChild(pulse);

                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "app-node");
                g.onclick = () => window.open(app.link, '_blank');

                const boxWidth = 140 + (app.name.length * 2);
                const boxHeight = 44;

                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", endX - boxWidth/2); 
                rect.setAttribute("y", endY - boxHeight/2);
                rect.setAttribute("width", boxWidth); 
                rect.setAttribute("height", boxHeight);
                rect.setAttribute("rx", "22"); 
                rect.setAttribute("class", "node-rect");

                const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
                const domain = new URL(app.link).hostname;
                img.setAttribute("href", `https://www.google.com/s2/favicons?sz=64&domain=${domain}`);
                img.setAttribute("x", endX - boxWidth/2 + 15); 
                img.setAttribute("y", endY - 10);
                img.setAttribute("width", "20"); 
                img.setAttribute("height", "20");

                const askTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                askTxt.setAttribute("x", endX - boxWidth/2 + 45); 
                askTxt.setAttribute("y", endY + 5);
                askTxt.setAttribute("class", "node-text-ask");
                askTxt.textContent = "Ask";

                const nameTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                nameTxt.setAttribute("x", endX - boxWidth/2 + 78); 
                nameTxt.setAttribute("y", endY + 5);
                nameTxt.setAttribute("class", "node-text-name");
                nameTxt.textContent = app.name;

                g.appendChild(rect); 
                g.appendChild(img); 
                g.appendChild(askTxt); 
                g.appendChild(nameTxt);
                nodesGroup.appendChild(g);
            });
        }
    </script>
</body>
</html>
